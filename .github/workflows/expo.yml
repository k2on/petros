# Building the Expo peer, on machines that can.
#
# The Rust is the same on every platform; what differs is the toolchain that
# turns it into something a phone loads. Google publishes the NDK as x86_64
# binaries only, and Apple's linker only exists inside Xcode — so neither build
# can run on an ARM Linux workstation, and both run here instead.
#
# Nix does the same job on both runners it does locally: the Rust toolchain, the
# targets and bun all come out of `flake.nix`, so a green run here means the
# same versions a contributor has.
name: expo

on:
  push:
    paths:
      - "crates/**"
      - "clients/expo/**"
      - "flake.*"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/expo.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The cheap check, and the one that catches almost everything: does the Rust
  # still generate bindings the app typechecks against? No NDK, no Xcode.
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build the mutator module
        run: nix develop --command just mutators
      - name: Generate and typecheck
        run: nix develop --command just ffi-bindings
      - name: The Rust the bindings came from
        run: nix develop --command just test

  android:
    runs-on: ubuntu-latest
    env:
      # What Expo SDK 57 asks gradle for. Pinned here rather than left to
      # whatever the runner image ships, so a new image cannot silently change
      # the build — and so `cargo ndk` and the Android Gradle Plugin are looking
      # at the same NDK rather than two.
      NDK_VERSION: 27.1.12297006
      COMPILE_SDK: "36"
      BUILD_TOOLS: 36.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # The SDK comes from the runner, not from nix. AGP resolves versions
      # against the SDK directory and installs what is missing, which a nix
      # store path can never allow. nix still pins everything that is ours:
      # the Rust toolchain, its Android targets, cargo-ndk and bun.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.COMPILE_SDK }}
            build-tools;${{ env.BUILD_TOOLS }}
            ndk;${{ env.NDK_VERSION }}
            cmake;3.22.1
      - name: Point every tool at the same NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build the Rust and the turbo module
        run: |
          nix develop .#android --command bash -c '
            cargo build -p todo-wasm --target wasm32-unknown-unknown --profile mutators
            cargo run -q -p petros-codegen
            cd clients/expo && bun install
            cd modules/petros-todo
            ../../node_modules/.bin/ubrn build android \
              --config ubrn.config.yaml --and-generate --release
          '

      # `run:android` would need an emulator; stopping at the APK is what tells
      # us the JNI, the CMake and the Rust still agree.
      - name: Prebuild and assemble
        run: |
          nix develop .#android --command bash -c '
            cd clients/expo
            bunx expo prebuild --platform android --clean
            cd android && ./gradlew assembleDebug --no-daemon
          '

      - uses: actions/upload-artifact@v4
        with:
          name: petros-todo-android
          path: clients/expo/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    # Apple silicon runners, so the simulator slice is the native one.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # The iOS targets come from `rust-toolchain.toml` like every other one, so
      # nix supplies the compiler; Xcode supplies the linker and the SDK, and
      # only the runner has those.
      - name: Build the Rust and the xcframework
        run: |
          nix develop --command bash -c '
            cd clients/expo && bun install
            cd modules/petros-todo
            ../../node_modules/.bin/ubrn build ios \
              --config ubrn.config.yaml --and-generate --release
          '
      # Continuous Native Generation: `ios/` is not in the tree, it is made
      # here. CocoaPods and xcodebuild come from the runner image rather than
      # the flake, because they are Xcode's, not ours.
      - name: Prebuild
        run: nix develop --command bash -c 'cd clients/expo && bunx expo prebuild --platform ios --clean'
      - name: Pods
        run: cd clients/expo/ios && pod install
      - name: Build for the simulator
        run: |
          cd clients/expo/ios
          xcodebuild \
            -workspace petrosexpo.xcworkspace \
            -scheme petrosexpo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
