# The engine's own suite, on every push.
#
# There was no such thing until now: the only workflow here published the
# browser peer, so a hundred tests ran on a laptop and nowhere else. A branch
# could go green locally and land broken for anyone whose toolchain differed by
# a version.
#
# It runs exactly what `just` runs, and nix supplies the same toolchain the
# flake gives a contributor — so "it passes for me" and "it passes in CI" are
# the same claim rather than two.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # `just test` builds the mutator module first, because the conformance
      # tests `include_bytes!` it — a missing artifact is a build error rather
      # than a skipped test, which is the behaviour we want and the reason this
      # is not two separate steps.
      - name: fmt, clippy and the suite
        run: nix develop --command just

      # The module has to keep building for the sandbox, and keep being small:
      # Metro pushes it on every save. A dependency that quietly follows the
      # engine in here is the failure this guards against.
      - name: The module builds without the engine in it
        run: |
          nix develop --command cargo tree -p todo --no-default-features \
            -e normal --target wasm32-unknown-unknown
