[workspace]
resolver = "2"
members = ["crates/exo", "crates/todo", "crates/ffi"]

[workspace.package]
edition = "2021"
license = "MIT"
# The oldest toolchain that builds the dependency tree: diesel_derives
# (via darling) and ratatui (via instability) both require 1.88. Verified by
# building and testing the workspace on exactly this version.
rust-version = "1.88"

[workspace.dependencies]
ciborium = "0.2"
exo = { path = "crates/exo" }
todo = { path = "crates/todo" }
# `fira-sans` embeds a default font. Without it iced asks the system for
# one, which works on a desktop and gets you nothing at all in a browser:
# wasm has no font access, so every glyph silently fails to draw.
iced = { version = "0.14", features = ["fira-sans"] }
rand = "0.8"
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
# `bundled` is applied per target, not here: the browser build must NOT
# bundle, because SQLite's C cannot compile for wasm32-unknown-unknown.
libsqlite3-sys = "0.30"
sqlite-wasm-rs = "0.5"
web-time = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
# Pinned exactly: `uniffi-bindgen-react-native` pins `uniffi = "=0.31"`, and the
# generator and the runtime must agree on the metadata format or the bindings
# it emits will not match the library it read them from.
uniffi = "=0.31"
uuid = { version = "1", features = ["serde"] }

[profile.test]
opt-level = 1

# `just iced` runs a `dev` build, and iced is not a library you only compile:
# every frame goes through its text shaping and its rasteriser. Unoptimised,
# that is slow enough to feel while scrolling. Dependencies change rarely, so
# optimise them and leave this workspace's own crates at `opt-level = 0`, where
# an edit still rebuilds in a second.
[profile.dev.package."*"]
opt-level = 2
