[workspace]
resolver = "2"
members = ["clients/iced", "crates/exo"]

[workspace.package]
edition = "2021"
license = "MIT"
# The oldest toolchain that builds the dependency tree: diesel_derives
# (via darling) and ratatui (via instability) both require 1.88. Verified by
# building and testing the workspace on exactly this version.
rust-version = "1.88"

[workspace.dependencies]
ciborium = "0.2"
iced = "0.14"
rand = "0.8"
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
# `bundled` is applied per target, not here: the browser build must NOT
# bundle, because SQLite's C cannot compile for wasm32-unknown-unknown.
libsqlite3-sys = "0.30"
sqlite-wasm-rs = "0.5"
web-time = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
uuid = { version = "1", features = ["serde"] }

[profile.test]
opt-level = 1
