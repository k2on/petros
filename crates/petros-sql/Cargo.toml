[package]
name = "petros-sql"
version = "0.1.0"
description = "Row types for a Petros app, generated from its schema.sql by asking SQLite what is in it."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

# All build-time. None of this reaches the module: what the macro emits is a
# string and some values, which is why a domain compiled to wasm can use it
# while SQLite itself cannot go there.
[dependencies]
proc-macro2 = "1"
quote = "1"
# `column_decltype` is the feature that makes this possible at all: it exposes
# what SQLite declares each result column to be, which is where the field types
# in `query!` come from.
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }

[dev-dependencies]
# Running what the macro checked. A dev-dependency on the engine, which does
# not depend on this crate, so there is no cycle.
diesel = { workspace = true, features = ["sqlite"] }
petros.workspace = true
petros-schema.workspace = true
