[package]
name = "petros-schema"
version = "0.1.0"
description = "What a Petros app is, as data: the verbs, their arguments, their types."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Deliberately at the bottom of the dependency graph, and deliberately almost
# empty. Four things read this: the domain crate that declares one, the wasm
# module compiled from it, the host that runs the module, and the code
# generator that turns it into TypeScript. Anything heavier here would be paid
# by all four, including the one compiled to `wasm32-unknown-unknown`.
[dependencies]
ciborium = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
# Off by default: a schema only needs serialising when it travels — out of a
# built module, or over a wire. The declaration itself does not.
default = []
serde = ["dep:serde"]
# `mutations!` and the CBOR accessors it decodes through. Wanted by a domain
# crate and by nothing else — the code generator reads schemas, it never
# decodes a payload, and paying for ciborium there would put it in the loop.
cbor = ["dep:ciborium"]
# Authoring a mutation from JSON. Wanted by the native side of an app and by
# nothing else: a domain compiled to wasm decodes payloads and never writes one,
# and `serde_json` has no business in a module Metro pushes on every save.
author = ["cbor", "dep:serde_json", "dep:uuid"]

[dev-dependencies]
# For `ffi_row!`'s doctest. The macro emits a `uniffi::Record` derive and
# nothing else of uniffi's, so a caller that is not building an FFI never sees
# it — but a macro whose only test is "it compiled once" is not tested.
uniffi = "0.31"
