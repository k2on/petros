[package]
autoexamples = false
name = "petros"
version = "0.1.0"
description = "An offline-first sync engine: an append-only, server-ordered log of mutations with client-side rebase."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# A deliberately thin, obviously replaceable WebSocket transport. Not part of
# the core: `petros::client` and `petros::server` never touch a socket.
ws = ["dep:tungstenite", "dep:wasm-bindgen", "dep:web-sys"]

[dependencies]
# The store contract. `apply` sees the typed half; `backend.rs` implements the
# dynamic half over SQLite.
petros-macros.workspace = true
petros-schema.workspace = true
# The view layer. A dev-dependency cycle again — it tests against this crate —
# and re-exported as `petros::ivm` so an app needs one dependency line, not two.
petros-ivm.workspace = true
ciborium.workspace = true
diesel.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true


# Native: SQLite's C, compiled and linked in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libsqlite3-sys = { workspace = true, features = ["bundled"] }
tungstenite = { version = "0.24", optional = true }

# Browser: the same C, but compiled for wasm by `sqlite-wasm-rs`, which also
# supplies the libc shims SQLite needs and registers an in-memory VFS. Diesel
# reaches it through `libsqlite3-sys`'s declarations, which resolve to those
# symbols at link time — so `libsqlite3-sys` must NOT bundle here, or there
# would be two SQLites. Cargo unifies features per target, which is what makes
# that split expressible at all.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Two majors of getrandom end up in a browser build: 0.2 via `rand`, 0.3 via
# iced. They want telling about the browser in different ways — 0.2 takes a
# feature, 0.3 also needs a cfg flag, which the web recipe passes.
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
libsqlite3-sys.workspace = true
sqlite-wasm-rs.workspace = true
wasm-bindgen = { version = "0.2", optional = true }
web-time.workspace = true
web-sys = { version = "0.3", optional = true, features = [
    "BinaryType",
    "CloseEvent",
    "Location",
    "MessageEvent",
    "WebSocket",
    "Window",
] }

[dev-dependencies]
petros-macros.workspace = true
petros-schema.workspace = true
# The view layer. A dev-dependency cycle again — it tests against this crate —
# and re-exported as `petros::ivm` so an app needs one dependency line, not two.
petros-ivm.workspace = true
# The simulated network. A dev-dependency cycle — it depends on this crate —
# which cargo resolves without complaint and which is the only honest shape:
# the testkit is for apps, and the engine is just another user of it.
petros-testkit.workspace = true
# The example app, because it writes through the store — which is what makes a
# change reportable at all. The hand-rolled fixture in `tests/common` writes
# with diesel to demonstrate the low-level API, and reports nothing by design.
todo = { workspace = true, features = ["storage"] }
proptest = "1"
tempfile = "3"
