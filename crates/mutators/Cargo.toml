[package]
name = "petros-mutators"
version = "0.1.0"
description = "Running the domain from a wasm module: the host side of crates/todo-wasm, shared by every peer and the server."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ciborium.workspace = true
# Direct, not through `petros`'s re-export: Diesel's derives generate `::diesel`
# paths and need to find the crate at that name.
diesel.workspace = true
petros.workspace = true
# The domain, for authoring payloads. `apply` here comes from the module, but
# building a mutation is the same code every peer uses.
todo = { workspace = true, features = ["storage"] }
serde.workspace = true
# Only for the generic entry point, which takes its arguments as JSON because
# that is what a foreign caller can write without a CBOR encoder.
# A pure-Rust wasm interpreter. No JIT, which is what makes it legal on iOS and
# what lets one module run on a server, in a TUI and on a phone.
wasmi = "2"

[dev-dependencies]
# The tests check the module against the schema it was generated from.
petros-schema.workspace = true
serde_json.workspace = true
# The tests run the real module against a real database.
diesel = { workspace = true, features = ["sqlite"] }
