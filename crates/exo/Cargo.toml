[package]
name = "exo"
version = "0.1.0"
description = "An offline-first sync engine: an append-only, server-ordered log of mutations with client-side rebase."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# A deliberately thin, obviously replaceable WebSocket transport. Not part of
# the core: `exo::client` and `exo::server` never touch a socket.
ws = ["dep:tungstenite"]

[dependencies]
ciborium.workspace = true
rand.workspace = true
tempfile = "3"
rusqlite.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
tungstenite = { version = "0.24", optional = true }

[dev-dependencies]
rand.workspace = true
tempfile = "3"
proptest = "1"

[[example]]
name = "offline"

[[example]]
name = "multiplayer"
required-features = ["ws"]
